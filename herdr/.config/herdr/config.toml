# Herdr keybindings that mirror Ryushe's tmux workflow.
# Installed at ~/.config/herdr/config.toml by ./ln_dotfiles.sh.

[terminal]
# Match tmux's -c "#{pane_current_path}" behavior for new panes and tabs.
new_cwd = "follow"

[ui]
# Draw dividers for split panes, but keep the outside pane frame removed.
pane_borders = "auto"
pane_outer_borders = false

[keys]
# tmux's prefix is Ctrl-b; Herdr keeps that default.
# Use both tmux's prefix+hjkl and its no-prefix Alt+hjkl pane navigation.
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# tmux-style session, workspace, and client navigation.
# Herdr's settings move aside to free prefix+s for the session navigator.
settings = "prefix+shift+s"
goto = ["prefix+s", "prefix+g"]
workspace_picker = "prefix+w"
previous_workspace = "prefix+("
next_workspace = "prefix+)"

# tmux-style detach. The displaced close-workspace action moves to a distinct key.
detach = "prefix+d"
close_workspace = "prefix+shift+backspace"

# Match tmux's prefix+r config reload without dropping Herdr resize mode.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Use Herdr's original next/previous-tab keys. Pane cycling stays on Herdr's
# Ctrl-b Tab / Ctrl-b Shift+Tab defaults, and Ctrl-b ; selects the last pane.
next_tab = "prefix+n"
previous_tab = "prefix+p"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+semicolon"

# Herdr tabs are tmux's closest window equivalent. Use Ryushe's preferred
# prefix+. rename shortcut and tmux's standard prefix+, alias.
rename_tab = ["prefix+period", "prefix+comma"]

# tmux split keys. Herdr names a stacked split horizontal and side-by-side vertical.
split_horizontal = "prefix+double_quote"
split_vertical = "prefix+percent"

# Other directly transferable tmux defaults.
new_tab = "prefix+c"
close_tab = "prefix+ampersand"
copy_mode = "prefix+["
zoom = "prefix+z"
